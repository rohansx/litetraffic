# Kill Bill 0.24.22 (current stable), local only. Port binds to 127.0.0.1:8480.
name: lt-killbill
services:
  db:
    image: killbill/mariadb:0.24
    environment:
      MYSQL_ROOT_PASSWORD: killbill
  killbill:
    image: killbill/killbill:0.24.22
    depends_on: [db]
    ports: ["127.0.0.1:8480:8080"]
    environment:
      KILLBILL_DAO_URL: jdbc:mysql://db:3306/killbill
      KILLBILL_DAO_USER: root
      KILLBILL_DAO_PASSWORD: killbill
      KILLBILL_CATALOG_URI: SpyCarAdvanced.xml
      KILLBILL_SERVER_TEST_MODE: "true"
      KB_org_killbill_server_updateCheck_skip: "true"
    volumes:
      - plugins:/var/lib/killbill/bundles/plugins
volumes:
  plugins:
